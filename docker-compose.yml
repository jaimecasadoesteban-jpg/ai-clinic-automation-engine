# Postgres para los tests. NO es la base de datos de desarrollo ni de producción:
# esa vive en Supabase.
#
# `trust` y sin contraseña a propósito, para que no haya ni un secreto en el
# repositorio. Es admisible porque el contenedor está atado a localhost, los
# datos son de usar y tirar (`tmpfs`: mueren al parar el contenedor) y aquí no
# entra jamás un dato real de paciente.
services:
  postgres:
    image: postgres:17-alpine
    container_name: clinic-automation-engine-demo-db
    environment:
      POSTGRES_DB: motor_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5544:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d motor_test']
      interval: 2s
      timeout: 3s
      retries: 20
